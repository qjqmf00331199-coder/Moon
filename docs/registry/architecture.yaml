#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: checkpoint_capture_restore
    status: active
    pattern: direct_call
    producer: checkpoint-subsystem
    consumers:
      - health-damage-core (death handling calls RestoreCheckpoint instead of level reload)
      - checkpoint-trigger-actors (call CaptureCheckpoint on overlap)
      - boss-phase (calls CaptureCheckpoint at phase-start)
    adr: docs/architecture/0002-checkpoint-persistence.md
    signal_signature: "CaptureCheckpoint(APawn* Player): void / RestoreCheckpoint(APawn* Player): void / HasActiveCheckpoint(): bool"
    referenced_by:
      - docs/architecture/0002-checkpoint-persistence.md
    added: 2026-07-18
    revised: ""

  - contract: camera_tuning_data
    status: active
    pattern: shared_resource
    producer: camera-system (UMoonCameraSettings DataAsset)
    consumers:
      - camera-system (AMoonCharacterBase reads at BeginPlay)
      - camera-system (AMoonPlayerCameraManager reads pitch clamp + shake config)
    adr: docs/architecture/0005-camera-system-springarm.md
    signal_signature: "UMoonCameraSettings (UDataAsset) — single source of truth for all 12 camera Tuning Knobs values"
    referenced_by:
      - docs/architecture/0005-camera-system-springarm.md
    added: 2026-07-23
    revised: ""

  - contract: camera_pitch_ownership
    status: active
    pattern: direct_call
    producer: camera-system (AMoonPlayerCameraManager)
    consumers:
      - camera-system only — no other system reads or writes view pitch clamp
    adr: docs/architecture/0005-camera-system-springarm.md
    signal_signature: "Pitch clamp lives on AMoonPlayerCameraManager, NOT CharacterMovementComponent — camera-system-base.md Rule 2 explicitly assigns this ownership"
    referenced_by:
      - docs/architecture/0005-camera-system-springarm.md
    added: 2026-07-23
    revised: ""

  - contract: attack_telegraph_contract
    status: active
    pattern: signal
    producer: enemy-ai (AMoonEnemyCharacterBase, broadcast from AnimNotify pair)
    consumers:
      - dash-evasion (not yet designed — subscribes for just-dodge timing)
    adr: docs/architecture/0006-enemy-ai-behavior-tree.md
    signal_signature: "OnAttackTelegraphed() / OnAttackCommitted() — multicast delegates on the enemy Character instance, broadcast by UAnimNotify_AttackTelegraphed/UAnimNotify_AttackCommitted"
    referenced_by:
      - docs/architecture/0006-enemy-ai-behavior-tree.md
    added: 2026-07-23
    revised: ""

  - contract: enemy_telegraph_query
    status: active
    pattern: direct_call
    producer: enemy-ai (AMoonEnemyCharacterBase)
    consumers:
      - dash-evasion (UMoonGameplayAbility_Dash::CheckJustDodge — queries at dash-activation time, does not pre-subscribe)
    adr: docs/architecture/0007-dash-evasion-just-dodge.md
    signal_signature: "IsTelegraphingAttack(): bool / GetAttackCommittedTime(): float — additive query accessors on AMoonEnemyCharacterBase, set/cleared by the same AnimNotify pair as the attack_telegraph_contract delegates. Owning ADR is 0006; added by ADR-0007."
    referenced_by:
      - docs/architecture/0006-enemy-ai-behavior-tree.md
      - docs/architecture/0007-dash-evasion-just-dodge.md
    added: 2026-07-23
    revised: ""

  - contract: death_event
    status: active
    pattern: signal
    producer: health-damage-core (UMoonAttributeSet::PostGameplayEffectExecute → IMoonHealthEventInterface::HandleDeath → per-class OnDeath broadcast)
    consumers:
      - checkpoint-subsystem (ADR-0002 — AMoonCharacterBase::OnDeath triggers RestoreCheckpoint)
      - luna-overdrive (ADR-0004 — subscribes for PlayerDeath end-reason)
      - enemy-ai (ADR-0006 — AMoonEnemyCharacterBase::OnDeath triggers StopLogic/ragdoll/despawn)
    adr: docs/architecture/0008-health-damage-core-death-event-contract.md
    signal_signature: "FOnMoonDeath OnDeath (multicast, no payload) — declared independently on AMoonCharacterBase and AMoonEnemyCharacterBase, both broadcast from their own IMoonHealthEventInterface::HandleDeath_Implementation(), guaranteed exactly-once per instance via UMoonAttributeSet::bIsDead"
    referenced_by:
      - docs/architecture/0002-checkpoint-persistence.md
      - docs/architecture/0004-luna-overdrive-fixed-window.md
      - docs/architecture/0006-enemy-ai-behavior-tree.md
      - docs/architecture/0008-health-damage-core-death-event-contract.md
    added: 2026-07-27
    revised: ""

  - contract: execution_event
    status: active
    pattern: signal
    producer: health-damage-core (AMoonCharacterBase::TryExecute, after confirming the target's Override-to-0 GameplayEffect applied)
    consumers:
      - spell-casting/mana (not yet implemented — 100% mana refund on OnExecuted per spell-casting-base.md, health-damage-core.md Rule 9)
    adr: docs/architecture/0008-health-damage-core-death-event-contract.md
    signal_signature: "FOnMoonExecuted OnExecuted(AActor* Target) — broadcast only on the TryExecute success path, distinct from OnDeath (which fires for any death, not only executions)"
    referenced_by:
      - docs/architecture/0008-health-damage-core-death-event-contract.md
    added: 2026-07-27
    revised: ""

  - contract: element_cooldown_query
    status: active
    pattern: direct_call
    producer: spell-casting (UMoonAbilitySystemComponent)
    consumers:
      - combat-hud (W4 cooldown overlay — subscribes via RegisterGameplayTagEvent on the returned tag, reads Remaining/Duration for the fraction)
    adr: docs/architecture/0003-spell-casting-gas-implementation.md
    signal_signature: "GetElementCooldownTag(Element): FGameplayTag / GetElementCooldownRemaining(Element): float / GetElementCooldownDuration(Element): float — additive query accessors on UMoonAbilitySystemComponent over the existing Cooldown GameplayEffect+tag ADR-0003 already applies. Owning ADR is 0003; added by ADR-0010 (same enemy_telegraph_query-style additive-extension pattern as ADR-0007 on ADR-0006)."
    referenced_by:
      - docs/architecture/0003-spell-casting-gas-implementation.md
      - docs/architecture/0010-combat-hud-widget-architecture.md
    added: 2026-07-27
    revised: ""

  - contract: damage_ge_vs_reclamp_disambiguation
    status: active
    pattern: direct_call
    producer: health-damage-core (UMoonAttributeSet's generic GetGameplayAttributeValueChangeDelegate(Health), FOnAttributeChangeData::GEModData field)
    consumers:
      - combo-tension-gauge (ADR-0011 — damage-penalty trigger, filters GEModData != nullptr && NewValue < OldValue to exclude ADR-0008's MaxHealth-driven PreAttributeChange reclamp)
    adr: docs/architecture/0011-combo-tension-gauge.md
    signal_signature: "FOnAttributeChangeData::GEModData != nullptr distinguishes a GameplayEffect-originated attribute write from a direct/PreAttributeChange-driven one (e.g. ADR-0008's MaxHealth re-clamp) on the SAME attribute-change delegate — use this filter instead of adding a new dedicated event whenever a consumer needs 'was this an actual GameplayEffect application' on an attribute that also has non-GE write paths."
    referenced_by:
      - docs/architecture/0011-combo-tension-gauge.md
    added: 2026-07-27
    revised: ""

