# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_attributeset_write_on_restore
    status: active
    description: "Checkpoint restore must never write UMoonAttributeSet values directly.
      Restore must go through GameplayEffect application."
    why: "Direct attribute writes bypass GAS's effect-based mutation pipeline (aggregators,
      GameplayCue hooks, prediction) and can desync from the damage pipeline's Execution
      Calculation established in ADR-0001."
    adr: docs/architecture/0002-checkpoint-persistence.md
    added: 2026-07-18

  - pattern: hardcoded_camera_tuning_in_constructor
    status: active
    description: "Camera tuning values (arm length, socket offset, lag speed/distance,
      pitch clamp, FOV, probe size, etc.) must not be C++ constructor literals.
      Must be read from UMoonCameraSettings (UDataAsset) at BeginPlay."
    why: "camera-system-base.md's Tuning Knobs section explicitly mandates designer-tunable
      values without a recompile. The pre-ADR-0005 implementation violated this by
      hardcoding all values directly in MoonCharacterBase.cpp's constructor."
    adr: docs/architecture/0005-camera-system-springarm.md
    added: 2026-07-23

  - pattern: time_dilation_for_presentation
    status: active
    description: "No form of Time Dilation (SetGlobalTimeDilation, per-actor CustomTimeDilation, or
      any equivalent) may be used to implement hitstop, execution presentation, or any other
      visual-freeze moment. Gameplay tick (movement input, cast-state processing) must run at
      100% normal rate at all times; freezes are presentation-layer only (capture-and-blend on
      the mesh/camera, never on the Capsule/CMC)."
    why: "player-movement.md Core Rules 8/9/11 and health-damage-core.md Rule 5 all independently
      state the same judgment/presentation separation principle. The pre-ADR-0009 hitstop
      implementation used CustomTimeDilation, violating Rule 9 (flagged as V-1 in
      architecture-review-2026-07-27.md) — this pattern exists so the next presentation-freeze
      feature (e.g. a future execution/impact moment) doesn't reach for the same shortcut."
    adr: docs/architecture/0009-player-movement-runtime-contract.md
    added: 2026-07-27

  - pattern: montage_based_input_lock
    status: active
    description: "Locomotion animations (jump, land, etc.) must never block AddMovementInput via
      montage-driven input lock (e.g. bStopAllMontages-style patterns). All locomotion anims must
      be non-root-motion; pose is presentation only and never gates movement processing."
    why: "player-movement.md Core Rule 8 generalizes Core Rule 7's 'movement never blocks casting'
      guarantee to all locomotion animation — a montage lock would silently reintroduce the exact
      class of judgment/presentation coupling Rule 9's hitstop fix (ADR-0009) removes elsewhere."
    adr: docs/architecture/0009-player-movement-runtime-contract.md
    added: 2026-07-27

