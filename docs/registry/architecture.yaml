# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: checkpoint_state_owner
    status: active
    api: UGameInstanceSubsystem (UMoonCheckpointSubsystem)
    not: "PlayerState or GameMode/GameState — both rejected: GameMode/GameState is destroyed on level travel (fails Arena Morphing survive-travel requirement); PlayerState would conflict with ADR-0001's decision that the player character does not require PlayerState ownership"
    adr: docs/architecture/0002-checkpoint-persistence.md
    reason: "GameInstanceSubsystem persists across level travel within one session, matching the in-memory-only, no-disk-I/O, survive-boss-transitions requirement"
    referenced_by:
      - docs/architecture/0002-checkpoint-persistence.md
    added: 2026-07-18
    revised: ""

  - purpose: enemy_ai_state_machine
    status: active
    api: "AIController + UBehaviorTree + UAIPerceptionComponent (classic, per-actor)"
    not: "Mass Framework (solves a swarm-scale problem MVP doesn't have — 2 archetypes, no confirmed large-swarm requirement) or StateTree (zero prior project experience/tooling, no requirement BT can't satisfy)"
    adr: docs/architecture/0006-enemy-ai-behavior-tree.md
    reason: "Single shared BT_Enemy_Base + Blackboard archetype branching keeps the state machine as one source of truth (enemy-ai-base.md Rule 1's shared-logic mandate). Boss Phase and future archetypes are expected to reuse this same pattern (enemy-ai-base.md Dependencies) — future ADRs for those systems must check this decision before introducing a different AI framework."
    referenced_by:
      - docs/architecture/0006-enemy-ai-behavior-tree.md
    added: 2026-07-23
    revised: ""

  - purpose: dash_motion_model
    status: active
    api: "Instant swept SetActorLocation position step (movement disabled for DashDuration, restored on end)"
    not: "LaunchCharacter / CharacterMovementComponent velocity override — superseded by commit 7f7e2e3 (\"make dash an instant step\"); reintroducing velocity-based dash would regress a deliberate, already-tuned decision"
    adr: docs/architecture/0007-dash-evasion-just-dodge.md
    reason: "Already shipped and tuned (TargetArmLength/camera pass in 2e6ba9f assumes this exact motion model); GDD Rule 2 was updated in the same commit pass to say \"즉시 위치 이동\" (instant position move), not velocity/impulse"
    referenced_by:
      - docs/architecture/0007-dash-evasion-just-dodge.md
    added: 2026-07-23
    revised: ""

  - purpose: death_detection_mechanism
    status: active
    api: "UMoonAttributeSet::PostGameplayEffectExecute — synchronous post-modifier check on the Health attribute, guarded by a bIsDead bool for exactly-once firing"
    not: "UMoonDamageExecCalc (ExecutionCalculation) — runs before the AttributeSet's own clamp, would duplicate clamp math and not cover TryExecute's direct Health-Override path; tick-based/polling HealthComponent — explicitly forbidden by health-damage-core.md Rule 5 (no delayed death judgment)"
    adr: docs/architecture/0008-health-damage-core-death-event-contract.md
    reason: "PostGameplayEffectExecute is the one seam every Health-modifying path (normal damage GE and TryExecute's Override-to-0 GE) passes through after the value is final — single point of truth for OnDeath/OnHealthPercentCrossed/State.Dead regardless of what caused the change"
    referenced_by:
      - docs/architecture/0008-health-damage-core-death-event-contract.md
    added: 2026-07-27
    revised: ""

  - purpose: hitstop_presentation_technique
    status: active
    api: "Capture mesh transform at freeze start, force mesh (not Capsule) to that transform for the freeze duration, blend back to real transform over 1-2 frames on unfreeze — Capsule/CMC never touched, gameplay tick unaffected"
    not: "CustomTimeDilation / SetGlobalTimeDilation (any form of Time Dilation) — explicitly forbidden by player-movement.md Core Rule 9 regardless of scope (per-actor or global); superseded the shipped 2026-07-20 implementation which used CustomTimeDilation"
    adr: docs/architecture/0009-player-movement-runtime-contract.md
    reason: "player-movement.md Core Rules 8/9/11 and health-damage-core.md Rule 5 all independently mandate that judgment/gameplay-tick and presentation are separate pipelines — Time Dilation of any kind violates this even when scoped to one actor, since it still dilates that actor's own Tick/AnimInstance update rate"
    referenced_by:
      - docs/architecture/0009-player-movement-runtime-contract.md
    added: 2026-07-27
    revised: ""

  - purpose: airborne_substate_representation
    status: active
    api: "Derived value — Velocity.Z sign, sampled every tick after Super::Tick() (post-CMC-tick) — no stored state, no transition table"
    not: "SetMovementModeWithCustomMode() / custom EMovementMode for Ascending vs Falling — both stay native MOVE_Falling; a stored custom mode would desync from external Z-impulse re-entry (Dash/Launch) the same way a fixed AirTime/2 timer already does not track real apex time"
    adr: docs/architecture/0009-player-movement-runtime-contract.md
    reason: "player-movement.md's own 구현 노트 explicitly warns against promoting these to custom movement modes, and doing so would introduce the exact deprecated-API risk (SetMovementModeWithCustomMode, unverified against real 5.8 headers) the GDD flags as its highest-risk Open Question — avoided entirely by not needing the API"
    referenced_by:
      - docs/architecture/0009-player-movement-runtime-contract.md
    added: 2026-07-27
    revised: ""

  - purpose: combat_hud_widget_base
    status: active
    api: "Plain UUserWidget (UMoonCombatHUDWidget), C++ owns all upstream data binding; BlueprintImplementableEvent hooks expose state to BP-driven visuals"
    not: "UCommonActivatableWidget / CommonUI's activation-focus-stack — that machinery exists for screens that participate in pad focus navigation (menus, inventory); Combat HUD is 100% non-focusable and explicitly excluded from the pad focus graph (combat-hud.md Rule 1), so adopting it would mean actively suppressing behavior CommonUI turns on by default, for no benefit"
    adr: docs/architecture/0010-combat-hud-widget-architecture.md
    reason: "A non-focusable, 100%-read-only HUD has no use for CommonUI's screen/activation-stack pattern. CommonUI is still used, but scoped narrowly to its input-method-detection utility for glyph swapping (TR-hud-007) — not as the widget's inheritance base. Future UI ADRs for genuinely focusable/navigable screens (menus, inventory) should default to CommonActivatableWidget instead — this decision applies to passive HUD-class widgets only, not project-wide."
    referenced_by:
      - docs/architecture/0010-combat-hud-widget-architecture.md
    added: 2026-07-27
    revised: ""

  - purpose: same_frame_ordering_via_tick_group
    status: active
    api: "A dedicated FTickFunction explicitly registered at TickGroup = TG_PostUpdateWork, when a system needs a deterministic same-frame ordering guarantee between two or more independent, unrelated call sites (e.g. two different systems both able to mutate the same state in one frame with no inherent call-order relationship)"
    not: "Leaving the resolution step inside the owning actor's default Tick() and asserting the ordering 'should' hold — this does not structurally guarantee anything about relative execution order against call sites outside that actor's own default tick group (ability activation, AnimNotify firing, etc. are not guaranteed to run before or after a default-group Tick in a way you should depend on)"
    adr: docs/architecture/0011-combo-tension-gauge.md
    reason: "ADR-0011's Gain→Penalty→Decay ordering requirement (TR-tension-004) could not be satisfied by deferring Penalty into the Character's normal Tick() alone — a Gain-triggering call (e.g. ability activation) could still fire after that Tick() in the same frame, producing the wrong order. Moving the Penalty+Decay resolution to TG_PostUpdateWork (the latest standard tick group) structurally guarantees it runs after normal same-frame input/ability/AnimNotify processing, closing the hole rather than assuming it won't occur. Any future ADR facing the same 'two independent triggers, one needs to always resolve after the other, same frame' shape should default to this pattern rather than re-deriving it."
    referenced_by:
      - docs/architecture/0011-combo-tension-gauge.md
    added: 2026-07-27
    revised: ""

