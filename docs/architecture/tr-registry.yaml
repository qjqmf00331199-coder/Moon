    created: 2026-07-18
    revised: 2026-07-27
    revision_note: "Same intent, added the temporal conjunct. spell-casting-base.md Core Rule 10 rewritten 2026-07-23 to require the lazy time comparison alongside the tag (ADR-0004 decision 6)."
    status: active
  - id: TR-spell-005
    system: spell
    gdd: design/gdd/spell-casting-base.md
    requirement: "Cast-rate limiter: hard cap 1 cast per element per frame plus global MaxCastsPerSecond (default 20), enforced regardless of bypass state"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-spell-006
    system: spell
    gdd: design/gdd/spell-casting-base.md
    requirement: "Subscribe to Health/Damage Core OnExecuted to snap Mana to MaxMana via Instant Override GE; passive regen via Infinite/Periodic Add GE; PostGameplayEffectExecute clamps Mana 0-MaxMana (idempotent)"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-spell-007
    system: spell
