  - id: TR-mov-001
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Extended CharacterMovementComponent with camera-relative input mapping, facing decoupled from movement direction (bOrientRotationToMovement=false, bUseControllerRotationYaw=true), instant per-tick yaw snap"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-002
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Movement input processing architecturally independent of spell/animation/execution/hitstop; Movement module must not reference SpellCasting types at compile time (Build.cs module-dependency exclusion)"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-003
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Airborne sub-states (Ascending/Falling) are not native movement modes; sign of Velocity.Z sampled after CMC tick is the authoritative transition trigger; handle external Z-impulse re-entry"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-004
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Data-asset tuning with hard clamps enforced on load-time and runtime write paths, plus a two-variable Joint Bound (computed AirTime 0.5s-3.0s), validated individual-clamps-first then joint-check"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-005
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Expose interface for external systems to inject velocity, including Z-axis launch/impulse API and temporary MaxWalkSpeed override (for Dash/Evasion, Arena Morphing)"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-006
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "MovementLocked flag with write access restricted to the Status Effect system only (Spell Casting and Execution denied write access)"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-007
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Timer-based input grace windows (Jump Input Buffer 150ms, Coyote Time 150ms) owned by the Character class, delta-time based not fixed tick counts"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-008
    system: mov
    gdd: design/gdd/player-movement.md
