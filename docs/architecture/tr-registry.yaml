    created: 2026-07-18
    revised: 2026-07-27
    revision_note: "Corrected mechanism, same Override intent. Original text captured dash-evasion.md Rule 4's 'velocity 덮어쓰기' wording, which commit 7f7e2e3 superseded and ADR-0007 Decision 1 / Alternative 1 explicitly rejects. dash-evasion.md Rule 2 already describes the position step — Rule 4 still contradicts it and needs its own fix (architecture-review-2026-07-27.md C-2)."
    status: active
  - id: TR-dash-003
    system: dash
    gdd: design/gdd/dash-evasion.md
    requirement: "On dash start grant Health/Damage Core State.Invulnerable tag (I-frames), remove at dash_invuln_duration expiry"
