    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-009
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "Input-to-response latency budget: p95 input->velocity-change <=33ms at 60fps, time-to-95%-speed <=50ms; measured via Unreal Insights trace scopes"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-mov-010
    system: mov
    gdd: design/gdd/player-movement.md
    requirement: "All locomotion animations authored non-root-motion (in-place); pose never drives translation (bEnableRootMotion==false)"
    created: 2026-07-18
    revised: ""
    status: active

