    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Grant/clear CostBypass.Active loose gameplay tag using non-counted set/clear semantics (SetLooseGameplayTagCount(1/0)) - explicitly NOT ref-counted Add/Remove - as the sole grantor"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-overdrive-003
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Implement duration via a plain timer variable OverdriveEndTime (no Duration-type GameplayEffect owning the tag); compute OverdriveTimeRemaining as OverdriveEndTime - CurrentTime"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-overdrive-004
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Every decision point (cast gate, expiry, trigger/death handlers) evaluates CurrentTime >= OverdriveEndTime lazily so contract holds regardless of subsystem execution order"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-overdrive-005
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Same-frame race determinism: expiry finalized at frame-end, re-trigger refreshes OverdriveEndTime (no Started/Ended re-emission), player Death takes eager priority"
    created: 2026-07-18
    revised: ""
    status: "superseded-by: TR-overdrive-009"
    superseded_note: "REPLACED, not reworded — the re-trigger clause inverted. luna-overdrive.md Rule 5 + AC5 (2026-07-21 fixed-window rewrite, re-approved 2026-07-23) make the 10s window fixed: a re-trigger during Active or Recovery is ignored and never refreshes EndTime. ADR-0004 decision 2 agrees. The expiry-at-frame-end and Death-eager-priority clauses carry forward into TR-overdrive-009. Superseded by /architecture-review 2026-07-27."
  - id: TR-overdrive-006
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "On player Death cancel timer and clear tag immediately; tolerate idempotent double-remove from HDC Death blanket tag-clear (Luna Overdrive is canonical owner)"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-overdrive-007
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Expose OnOverdriveStarted, OnOverdriveEnded(EndReason in {Expired, PlayerDeath}) exactly once per transition, and OverdriveTimeRemaining to downstream"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-overdrive-008
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Three-state boundary Inactive/Active/Recovery. Recovery is entered on Active expiry and lasts OverdriveRecoveryDuration (default 1.5s, safe range 1.0-2.0). Recovery locks tension gain ONLY — mana regen, paid casts with normal cost/cooldown, movement and dash all resume immediately on Recovery entry. Recovery exit returns to Inactive."
    created: 2026-07-27
    revised: ""
    source_note: "luna-overdrive.md Core Rule 8 + States and Transitions table + Recovery End Time formula (2026-07-21 fixed-window rewrite, re-approved 2026-07-23). Registered by /architecture-review 2026-07-27 — the Recovery state did not exist at the v2 population."
    status: active
  - id: TR-overdrive-009
    system: overdrive
    gdd: design/gdd/luna-overdrive.md
    requirement: "Fixed-window race determinism: a re-trigger received during Active or Recovery is ignored — it never refreshes OverdriveEndTime/RecoveryEndTime, never re-grants the tag, and emits no Started/Ended event. When expiry and re-trigger land on the same frame, expiry wins. Player Death takes eager priority over both (a same-frame trigger+Death emits no Started and grants no tag)."
    created: 2026-07-27
    revised: ""
    supersedes: TR-overdrive-005
    source_note: "luna-overdrive.md Core Rule 5 + Edge Cases (만료/재트리거 동일 프레임, 트리거/Death 동일 프레임) + AC5/AC7/AC9. Registered by /architecture-review 2026-07-27."
    status: active

  # --- Combat HUD (combat-hud.md) ---
  - id: TR-hud-001
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "UMG + CommonUI read-only presentation layer owning no gameplay state; all widgets non-focusable and excluded from pad focus-navigation graph"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-hud-002
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "Bind 7 widgets exclusively to interfaces already exposed by upstream systems (attribute delegates, OnCooldown+remaining, CurrentCharges, gauge value/state, overdrive events, State.Executable tag) - no new upstream interfaces"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-hud-003
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "Update event-driven by default (tick polling forbidden); permit ticking only for active visual interpolation and time sweeps, zero tick when idle, to meet 60fps/16.6ms budget"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-hud-004
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "Coalesce per-frame updates so any single widget rebuild/layout-invalidation happens at most once per frame, last-value-wins, even under same-frame event floods"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-hud-005
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "Trigger gameplay-meaningful signals (Charged highlight, overdrive flash) off real values/real events, never off interpolated display values"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-hud-006
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "Mirror upstream reset/death and overdrive state transitions (immediate marker removal on Death, crimson palette + infinite mana + cooldown-clear on OnOverdriveStarted, full revert on OnOverdriveEnded) without HUD making gameplay judgments"
    created: 2026-07-18
    revised: ""
    status: active
  - id: TR-hud-007
    system: hud
    gdd: design/gdd/combat-hud.md
    requirement: "Detect active input device and swap key glyphs (keyboard F <-> gamepad button) using the UE5.8 unified Input System, affecting glyph only"
    created: 2026-07-18
    revised: ""
    status: active
