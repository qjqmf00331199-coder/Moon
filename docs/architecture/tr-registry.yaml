    gdd: design/gdd/spell-casting-base.md
    requirement: "Passive Mana Regen pauses ONLY while Luna Overdrive is Active (entry Mana preserved, no retroactive drain or forced cost on exit); regen resumes immediately on Recovery entry. Regen formula gates on OverdriveActive, not on the CostBypass.Active tag."
    created: 2026-07-27
    revised: ""
    source_note: "spell-casting-base.md Core Rule 7 + Mana Regen Tick formula (revised 2026-07-23); luna-overdrive.md Rule 9. Registered by /architecture-review 2026-07-27 — this contract did not exist at the v2 population."
    status: active
  - id: TR-spell-009
    system: spell
    gdd: design/gdd/spell-casting-base.md
