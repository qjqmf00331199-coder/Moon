

; Story 005 (TR-cam-005, ADR-0005 Decision 5, GDD Edge Case 3): the stock "Destructible" collision
; profile (Engine/Config/BaseEngine.ini) has empty CustomResponses, so it inherits the engine's
; FCollisionResponseContainer::DefaultResponseContainer, which is ECR_Block for every channel —
; verified against the installed UE5.8 engine source (CollisionProfile.cpp / WorldCollision.cpp),
; not assumed. That means any actor using the "Destructible" profile currently BLOCKS the
; CameraBoom's ECC_Camera probe, exactly the jitter bug this story fixes. +EditProfiles patches a
; named profile's CustomResponses without redeclaring (and thereby losing) the rest of its stock
; definition — the ONLY entry changed is its response to the Camera channel; WorldStatic/WorldDynamic
; responses are untouched and remain Block. This registers the camera-side half of the contract;
; classifying actual debris under the "Destructible" profile is the Destructible Geometry epic's
; future job (not yet designed), per this story's Out of Scope.
[/Script/Engine.CollisionProfile]
+EditProfiles=(Name="Destructible",CustomResponses=((Channel="Camera",Response=ECR_Ignore)))

